<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1b8f72">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="NURA">
    <link rel="manifest" href="./manifest.json">
    <link rel="apple-touch-icon" href="./icons/icon-192.png">
    <title>NURA - Tu bienestar comienza aquí</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7f6;
            color: #263238;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .app {
            min-height: 100vh;
        }

        /* =========================
           PORTADA
        ========================= */

        .portada {
            min-height: 100vh;
            background-image: url("./nura-portada.png");
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 30px 20px;
        }

        .portada-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.96);
            border-radius: 28px;
            padding: 32px 28px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.18);
            text-align: center;
        }

        .logo {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: 5px;
            color: #1b8f72;
            margin-bottom: 8px;
        }

        .portada-card h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .portada-card p {
            line-height: 1.6;
            color: #607d7a;
            margin-bottom: 24px;
        }

        .btn-principal {
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 16px;
            color: white;
            font-size: 17px;
            font-weight: bold;
            background: linear-gradient(135deg, #1b8f72, #55b78e);
            box-shadow: 0 8px 18px rgba(27,143,114,0.25);
        }

        .btn-principal:hover {
            transform: translateY(-1px);
        }

        .mini-text {
            margin-top: 16px;
            font-size: 13px;
            color: #78909c;
        }

        /* =========================
           CONTENEDORES
        ========================= */

        .pantalla {
            min-height: 100vh;
            padding: 30px 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 850px;
            margin: auto;
        }

        .cabecera {
            text-align: center;
            margin-bottom: 25px;
        }

        .cabecera .logo {
            font-size: 32px;
        }

        .cabecera h2 {
            margin-bottom: 8px;
        }

        .cabecera p {
            color: #78909c;
        }

        .card {
            background: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        /* =========================
           FORMULARIO
        ========================= */

        .paso {
            display: none;
        }

        .paso.activo {
            display: block;
        }

        .paso h3 {
            font-size: 23px;
            margin-bottom: 10px;
        }

        .paso p {
            color: #78909c;
            margin-bottom: 22px;
        }

        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e7e5;
            border-radius: 14px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #1b8f72;
        }

        .opciones {
            display: grid;
            gap: 12px;
        }

        .opcion {
            border: 2px solid #e0e7e5;
            border-radius: 15px;
            padding: 16px;
            background: white;
            transition: 0.2s;
        }

        .opcion:hover {
            border-color: #8bcbb8;
        }

        .opcion.seleccionada {
            border-color: #1b8f72;
            background: #eaf7f2;
        }

        .opcion input {
            display: none;
        }

        .opcion strong {
            display: block;
            margin-bottom: 4px;
        }

        .opcion small {
            color: #78909c;
        }

        .subtitulo-catalogo { color:#5d7771; font-size:13px; margin-top:8px; }
        .preferencias-bebidas { margin-top:22px; }

        .alimentos-encabezado {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin: 18px 0 12px;
        }

        .btn-mini {
            border: none;
            background: #eaf7f2;
            color: #16745d;
            padding: 8px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .alimentos-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }

        .alimento-btn {
            border: 2px solid #e0e7e5;
            background: white;
            color: #455a64;
            padding: 12px 9px;
            border-radius: 13px;
            font-size: 13px;
            min-height: 48px;
        }

        .alimento-btn.seleccionado {
            border-color: #1b8f72;
            background: #eaf7f2;
            color: #16745d;
            font-weight: bold;
        }

        .alimento-btn.evitado {
            border-color: #d58b8b;
            background: #fff2f2;
            color: #a94444;
            font-weight: bold;
        }

        .contador-alimentos {
            margin-top: 12px;
            color: #1b8f72;
            font-size: 13px;
            font-weight: bold;
            text-align: center;
        }

        .alimentos-evitar {
            margin-top: 24px;
            padding-top: 20px;
            border-top: 1px solid #e2e9e6;
        }

        .alimentos-evitar > strong {
            display: block;
            margin-bottom: 5px;
        }

        .alimentos-evitar > small {
            display: block;
            color: #78909c;
            margin-bottom: 12px;
        }

        .dias-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .dia-btn {
            border: 2px solid #e0e7e5;
            background: white;
            padding: 15px 10px;
            border-radius: 14px;
            font-weight: bold;
            color: #455a64;
        }

        .dia-btn.seleccionado {
            background: #eaf7f2;
            border-color: #1b8f72;
            color: #16745d;
        }

        .contador-dias {
            margin-top: 15px;
            text-align: center;
            color: #1b8f72;
            font-weight: bold;
        }

        .navegacion {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .btn-secundario,
        .btn-siguiente {
            flex: 1;
            padding: 15px;
            border-radius: 14px;
            border: none;
            font-weight: bold;
        }

        .btn-secundario {
            background: #eceff1;
            color: #455a64;
        }

        .btn-siguiente {
            background: #1b8f72;
            color: white;
        }

        .progreso {
            height: 7px;
            background: #e8eeee;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progreso-barra {
            height: 100%;
            background: linear-gradient(90deg, #1b8f72, #55b78e);
            width: 10%;
            transition: 0.3s;
        }

        /* =========================
           PLAN SEMANAL
        ========================= */

        .bienvenida {
            background: linear-gradient(135deg, #1b8f72, #55b78e);
            color: white;
            border-radius: 22px;
            padding: 25px;
            margin-bottom: 20px;
        }

        .bienvenida h2 {
            margin-bottom: 8px;
        }

        .semana {
            display: grid;
            gap: 20px;
        }

        .dia-card {
            background: white;
            border-radius: 22px;
            padding: 22px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .dia-titulo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 18px;
        }

        .dia-titulo h3 {
            font-size: 21px;
        }

        .badge {
            background: #eaf7f2;
            color: #16745d;
            padding: 7px 11px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .badge-descanso {
            background: #edf5ef;
            color: #4d7758;
        }

        .comida {
            border: 1px solid #e6ecea;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 12px;
        }

        .comida:last-child {
            margin-bottom: 0;
        }

        .comida-header {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            align-items: center;
            margin-bottom: 8px;
        }

        .comida-header strong {
            font-size: 15px;
        }

        .btn-cambiar {
            border: none;
            background: #edf7f4;
            color: #16745d;
            padding: 7px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: bold;
        }

        .comida-texto {
            color: #455a64;
            line-height: 1.5;
        }

        .entrenamiento {
            margin-top: 18px;
            padding: 18px;
            border-radius: 17px;
            background: #f1faf7;
            border-left: 5px solid #1b8f72;
        }

        .entrenamiento h4 {
            margin-bottom: 12px;
            color: #16745d;
        }

        .ejercicio {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 9px 0;
            border-bottom: 1px solid #dcebe5;
            font-size: 14px;
        }

        .ejercicio:last-child {
            border-bottom: none;
        }

        .descanso {
            margin-top: 18px;
            padding: 18px;
            border-radius: 17px;
            background: #f2f8f3;
            color: #48644e;
            line-height: 1.5;
        }

        .boton-entrenar {
            width: 100%;
            margin-top: 15px;
            border: none;
            background: #1b8f72;
            color: white;
            padding: 14px;
            border-radius: 13px;
            font-weight: bold;
        }

        .hablar {
            position: sticky;
            bottom: 15px;
            width: 100%;
            border: none;
            padding: 16px;
            border-radius: 17px;
            background: #263238;
            color: white;
            font-weight: bold;
            font-size: 15px;
            margin-top: 20px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* =========================
           ENTRENAMIENTO
        ========================= */

        .entrenamiento-pantalla {
            text-align: center;
        }

        .ejercicio-numero {
            color: #1b8f72;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .ejercicio-grande {
            font-size: 30px;
            margin-bottom: 12px;
        }

        .series-info {
            color: #78909c;
            margin-bottom: 25px;
        }

        .timer {
            font-size: 65px;
            font-weight: bold;
            color: #1b8f72;
            margin: 25px 0;
        }

        .motivacion {
            background: #eaf7f2;
            color: #16745d;
            border-radius: 17px;
            padding: 18px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .controles {
            display: grid;
            gap: 10px;
        }

        .bloque-entrenamiento { margin-top: 18px; padding: 16px; border-radius: 17px; background: #f8fbfa; border: 1px solid #e2ece8; }
        .bloque-entrenamiento h5 { color: #16745d; margin-bottom: 10px; font-size: 14px; }
        .mini-ejercicio { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-bottom: 1px solid #e6eeeb; font-size: 13px; }
        .mini-ejercicio:last-child { border-bottom: none; }
        .cardio-box { margin-top: 14px; padding: 14px; border-radius: 15px; background: #f1f7ff; color: #40556a; }
        .calma-box { margin-top: 12px; padding: 14px; border-radius: 15px; background: #f2f8f3; color: #48644e; }
        .sesion-badge { display: inline-block; margin-top: 5px; color: #16745d; font-size: 12px; font-weight: bold; }
        .preparacion-texto {
            color: #607d7a;
            font-size: 13px;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .maquinas-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .maquina-btn {
            border: 2px solid #e0e7e5;
            background: white;
            color: #455a64;
            padding: 11px 8px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 13px;
        }

        .maquina-btn:hover,
        .maquina-btn.seleccionada {
            border-color: #1b8f72;
            background: #eaf7f2;
            color: #16745d;
        }

        .preparacion-seleccion {
            margin-top: 10px;
            color: #607d7a;
            font-size: 12px;
            text-align: center;
        }

        .preparacion-resumen {
            margin-bottom: 18px;
            padding: 14px;
            border-radius: 15px;
            background: #f1f7ff;
            color: #40556a;
            line-height: 1.5;
        }

        .serie-indicador {
            display: inline-block;
            background: #eaf7f2;
            color: #16745d;
            padding: 8px 12px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .objetivo-serie {
            color: #607d7a;
            font-size: 15px;
            margin-bottom: 18px;
        }

        .descanso-panel {
            background: #f1f7ff;
            border-radius: 17px;
            padding: 18px;
            margin: 18px 0;
        }

        .descanso-panel h3 {
            color: #40556a;
            margin-bottom: 8px;
        }

        .descanso-panel p {
            color: #607d7a;
            line-height: 1.5;
            margin-bottom: 12px;
        }

        .boton-completado {
            background: #1b8f72;
            color: white;
        }

        .resumen-sesion {
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:10px;
            margin:20px 0;
        }

        .resumen-sesion div {
            background:#f5f8f7;
            border-radius:15px;
            padding:14px 10px;
            text-align:center;
        }

        .resumen-sesion strong {
            display:block;
            color:#16745d;
            font-size:20px;
            margin-bottom:4px;
        }

        .resumen-sesion span {
            color:#607d7a;
            font-size:12px;
        }

        .historial-box {
            background:#f7faf9;
            border-radius:18px;
            padding:16px;
            margin-top:18px;
            text-align:left;
        }

        .historial-item {
            background:white;
            border:1px solid #e6eeeb;
            border-radius:14px;
            padding:12px 14px;
            margin-top:10px;
        }

        .historial-item strong {
            color:#16745d;
        }

        .historial-meta {
            color:#607d7a;
            font-size:12px;
            margin-top:5px;
            line-height:1.5;
        }

        .progreso-grid {
            display:grid;
            grid-template-columns:repeat(3,1fr);
            gap:10px;
            margin:18px 0;
        }

        .progreso-card {
            background:#f5f8f7;
            border-radius:15px;
            padding:14px 10px;
            text-align:center;
        }

        .progreso-card strong {
            display:block;
            color:#16745d;
            font-size:22px;
            margin-bottom:4px;
        }

        .progreso-card span {
            color:#607d7a;
            font-size:11px;
        }

        .progreso-mensaje {
            background:#eef8f4;
            border-radius:15px;
            padding:14px 16px;
            color:#315d50;
            line-height:1.6;
            margin-bottom:18px;
        }

        @media (max-width:650px) {
            .progreso-grid {
                grid-template-columns:1fr;
            }
        }

        .enfriamiento-lista {
            text-align:left;
            background:#f2f8f3;
            border-radius:15px;
            padding:14px 18px;
            color:#48644e;
            line-height:1.8;
            margin:18px 0;
        }



        /* =========================
           RESPONSIVE
        ========================= */


        @media (max-width: 649px) {
            .portada {
                min-height: 100svh;
                padding: 18px 14px;
                align-items: flex-end;
                background-position: center top;
            }

            .portada-card {
                border-radius: 24px;
                padding: 26px 20px;
            }

            .logo {
                font-size: 36px;
            }

            .portada-card h1 {
                font-size: 23px;
            }

            .pantalla {
                padding: 18px 12px;
            }

            .card, .dia-card {
                padding: 18px;
                border-radius: 18px;
            }

            .comida-header, .dia-titulo {
                align-items: flex-start;
            }

            .comida-header {
                flex-wrap: wrap;
            }

            .mini-ejercicio {
                flex-direction: column;
                gap: 3px;
            }

            .maquina-btn {
                min-height: 46px;
                font-size: 12px;
            }

            .mini-ejercicio strong {
                color: #607d7a;
            }

            .ejercicio-grande {
                font-size: 25px;
            }

            .timer {
                font-size: 56px;
            }

            .navegacion {
                position: sticky;
                bottom: 8px;
                background: rgba(255,255,255,0.96);
                padding-top: 8px;
            }
        }

        @media (min-width: 650px) {
            .alimentos-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .dias-grid {
                grid-template-columns: repeat(4, 1fr);
            }

            .portada {
                align-items: center;
            }
        }
    
        /* =========================
           VOZ NURA
        ========================= */
        .voz-panel {
            position: fixed;
            inset: 0;
            background: rgba(15, 32, 38, 0.48);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 9999;
        }

        .voz-card {
            width: 100%;
            max-width: 520px;
            background: rgba(255,255,255,0.98);
            border-radius: 28px;
            padding: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
        }

        .voz-orb {
            width: 96px;
            height: 96px;
            margin: 10px auto 18px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #1b8f72, #55b78e);
            color: white;
            font-size: 38px;
            box-shadow: 0 12px 28px rgba(27,143,114,0.28);
        }

        .voz-orb.escuchando {
            animation: pulsoNura 1.15s infinite;
        }

        @keyframes pulsoNura {
            0%, 100% { transform: scale(1); box-shadow: 0 12px 28px rgba(27,143,114,0.28); }
            50% { transform: scale(1.08); box-shadow: 0 12px 36px rgba(27,143,114,0.48); }
        }

        .voz-estado {
            min-height: 24px;
            color: #607d7a;
            margin: 10px 0 16px;
        }

        .voz-transcripcion {
            min-height: 58px;
            padding: 14px;
            border-radius: 16px;
            background: #f4f7f6;
            color: #263238;
            text-align: left;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .voz-ayuda {
            font-size: 13px;
            color: #78909c;
            line-height: 1.5;
            margin-top: 12px;
        }

    
        .bebida-box {
            margin-top: 10px;
            padding: 10px 12px;
            border-radius: 12px;
            background: #f3f8f6;
            color: #496662;
            font-size: 14px;
        }

        .bebida-box strong { color: #245f55; }

        .bebida-accion {
            border: 0;
            background: transparent;
            color: #1b8f72;
            font-weight: 700;
            cursor: pointer;
            margin-left: 6px;
        }


        /* =========================
           ENTRENAMIENTO EN CASA O PARQUE
        ========================= */
        .btn-casa {
            width: 100%; border: 2px solid #1b8f72; padding: 14px 16px;
            border-radius: 16px; color: #176b58; font-size: 16px; font-weight: 700;
            background: #effaf5; margin-top: 10px; transition: transform .15s ease;
        }
        .btn-casa:hover { transform: translateY(-1px); }
        .privacidad-card { max-width:760px; margin:0 auto; background:#fff; border:1px solid #dcebe5; border-radius:24px; padding:clamp(20px,4vw,34px); box-shadow:0 12px 32px rgba(18,80,61,.08); }
        .privacidad-lista { display:grid; gap:12px; margin:18px 0; }
        .privacidad-item { display:flex; gap:12px; align-items:flex-start; padding:13px; background:#f2f8f5; border-radius:14px; line-height:1.45; }
        .privacidad-item b { display:block; color:#176b58; margin-bottom:3px; }
        .consent-check { display:flex; gap:10px; align-items:flex-start; margin:18px 0; line-height:1.5; }
        .consent-check input, .alerta-check input { width:19px; height:19px; accent-color:#1b8f72; flex-shrink:0; }
        .alertas-lista { display:grid; gap:10px; margin:14px 0 22px; }
        .alerta-check { display:flex; gap:10px; align-items:center; padding:12px; border:1px solid #dcebe5; border-radius:13px; }
        .privacidad-nota { font-size:13px; color:#607d7a; line-height:1.5; margin-top:14px; }
        .casa-hero {
            background: linear-gradient(135deg,#e8f8f0,#f5fbff); border-radius: 22px;
            padding: 24px; margin-bottom: 20px; text-align: center;
        }
        .casa-hero .emoji { font-size: 42px; margin-bottom: 8px; }
        .casa-hero h2 { color: #176b58; margin-bottom: 8px; }
        .casa-hero p { color: #607d7a; line-height: 1.5; }
        .casa-form { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 14px; }

    let eventoInstalacionNura = null;

    function nuraYaEstaInstalada() {
        return window.matchMedia("(display-mode: standalone)").matches ||
               window.navigator.standalone === true;
    }

    function esIOS() {
        return /iPad|iPhone|iPod/.test(navigator.userAgent) ||
               (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    }

    function esAndroid() {
        return /Android/i.test(navigator.userAgent);
    }

    window.addEventListener("beforeinstallprompt", (evento) => {
        evento.preventDefault();
        eventoInstalacionNura = evento;
        const boton = document.getElementById("btnInstalarNura");
        if (boton && !nuraYaEstaInstalada()) boton.style.display = "block";
    });

    window.addEventListener("appinstalled", () => {
        eventoInstalacionNura = null;
        const boton = document.getElementById("btnInstalarNura");
        if (boton) boton.style.display = "none";
    });

    function mostrarAyudaInstalacionNura() {
        if (esIOS()) {
            alert("Para instalar NURA en tu iPhone o iPad:\n\n1. Pulsa el botón Compartir ↗️ de Safari.\n2. Selecciona 'Añadir a pantalla de inicio'.\n3. Pulsa 'Añadir'.\n\nAsí tendrás NURA como una aplicación en tu pantalla de inicio.");
            return;
        }

        if (esAndroid()) {
            alert("Para instalar NURA en Android:\n\n1. Abre el menú ⋮ de tu navegador.\n2. Busca 'Instalar aplicación', 'Instalar NURA' o 'Añadir a pantalla de inicio'.\n3. Confirma la instalación.\n\nSi tu navegador muestra directamente la ventana de instalación, solo confirma.");
            return;
        }

        alert("Para instalar NURA, usa el menú de tu navegador y selecciona la opción para instalar la aplicación o crear un acceso directo.");
    }

    async function instalarNura() {
        if (nuraYaEstaInstalada()) return;

        if (!eventoInstalacionNura) {
            mostrarAyudaInstalacionNura();
            return;
        }

        eventoInstalacionNura.prompt();
        await eventoInstalacionNura.userChoice;
        eventoInstalacionNura = null;

        const boton = document.getElementById("btnInstalarNura");
        if (boton && nuraYaEstaInstalada()) boton.style.display = "none";
    }

    function generarRutinaCasa() {
        const lugar = document.getElementById('casaLugar').value;
        const nivel = document.getElementById('casaNivel').value;
        const equipo = document.getElementById('casaEquipo').value;
        const objetivo = document.getElementById('casaObjetivo').value;
        const tiempo = Number(document.getElementById('casaTiempo').value);
        const ejercicios = {
          cuerpo: [
            ['Sentarse y levantarse de una silla','8–10 repeticiones','Mantén los pies apoyados y levántate con control.'],
            ['Flexiones en pared','8–10 repeticiones','Coloca las manos en la pared y mantén el cuerpo alineado.'],
            ['Elevaciones de talones','10–12 repeticiones','Sujétate de una superficie estable si necesitas equilibrio.'],
            ['Marcha suave en el sitio','45 segundos','Levanta los pies a un ritmo cómodo.'],
            ['Bird-dog (brazo y pierna contrarios)','6 por lado','Hazlo despacio, sin arquear la espalda.'],
            ['Remo con banda o sin equipo','8–10 repeticiones','Con banda, usa un anclaje diseñado para ello; sin banda, practica el gesto sin resistencia.'],
            ['Paso atrás corto con apoyo','6 por lado','Sujétate de una pared o silla estable y usa un recorrido cómodo.'],
            ['Empujes de manos contra la pared','8–10 repeticiones','Mantén el cuerpo alineado y evita forzar las muñecas.'],
            ['Marcha con rodillas bajas','30–45 segundos','Mantén un ritmo en el que puedas respirar con normalidad.']
          ],
          brazos: [
            ['Flexiones en pared','8–10 repeticiones','Mantén muñecas cómodas y cuerpo alineado.'],
            ['Círculos de hombros','8 hacia cada lado','Haz círculos pequeños y controlados.'],
            ['Curl de bíceps','8–10 repeticiones','Usa mancuernas ligeras o practica el movimiento sin peso.'],
            ['Extensión de tríceps sin peso','8–10 repeticiones','Muévete sin forzar los codos.'],
            ['Remo con banda o sin equipo','8–10 repeticiones','Usa solo una banda con anclaje seguro o realiza el gesto sin resistencia.'],
            ['Empuje de hombros sin peso','8 repeticiones','Eleva los brazos solo hasta donde sea cómodo y baja despacio.'],
            ['Apertura y cierre de brazos','10 repeticiones','Controla el movimiento sin subir los hombros hacia las orejas.']
          ],
          piernas: [
            ['Sentarse y levantarse de una silla','8–10 repeticiones','Controla el movimiento y evita dejarte caer.'],
            ['Elevaciones de talones','10–12 repeticiones','Sujétate si necesitas apoyo.'],
            ['Paso lateral corto','8 por lado','Da pasos cortos en una superficie despejada.'],
            ['Extensión de rodilla sentado','8 por pierna','Extiende una pierna sin bloquear la rodilla.'],
            ['Puente de glúteos','8–10 repeticiones','Si te resulta cómodo, hazlo sobre una superficie firme.'],
            ['Paso lateral corto','8 por lado','Mantén las rodillas cómodas y el espacio despejado.'],
            ['Extensión de cadera de pie','8 por pierna','Sujétate de un apoyo estable y evita arquear la espalda.'],
            ['Sentadilla parcial a silla','6–8 repeticiones','Baja solo hasta donde puedas mantener el control.']
          ],
          movilidad: [
            ['Marcha suave en el sitio','1 minuto','Respira con normalidad y usa un ritmo cómodo.'],
            ['Círculos de hombros','8 hacia cada lado','Haz movimientos suaves, sin dolor.'],
            ['Movilidad de tobillos','8 por lado','Puedes hacerlo sentado o de pie con apoyo.'],
            ['Sentarse y levantarse de una silla','6–8 repeticiones','Usa una silla estable y mueve el cuerpo con control.'],
            ['Equilibrio con apoyo','15–20 segundos por lado','Mantén una mano cerca de una pared o soporte estable.']
          ]
        };
        let lista = ejercicios[objetivo] || ejercicios.cuerpo;
        if (equipo === 'bandas' && objetivo !== 'movilidad') {
          lista = lista.map(e => e[0].startsWith('Remo') ? ['Remo con banda elástica','8–10 repeticiones','Usa únicamente una banda en buen estado y un anclaje seguro.'] : e);
        }
        if (equipo === 'mancuernas' && (objetivo === 'brazos' || objetivo === 'cuerpo')) {
          lista = lista.map(e => e[0] === 'Curl de bíceps' ? ['Curl de bíceps con mancuernas ligeras','8–10 repeticiones','Elige un peso que puedas controlar sin balancear el cuerpo.'] : e);
        }
        if (nivel === 'principiante') lista = lista.slice(0, Math.min(4, lista.length));
        // La duración elegida organiza la sesión, pero no convierte todo ese tiempo en esfuerzo intenso.
        // Las sesiones largas incluyen pausas y recuperación; se evita multiplicar excesivamente las rondas.
        const rondas = nivel === 'avanzado' && tiempo >= 45 ? 3 : (nivel === 'intermedio' && tiempo >= 45 ? 2 : (tiempo >= 30 ? 2 : 1));

          <div style="background:#effaf5;border-radius:14px;padding:13px;margin-bottom:10px;"><strong>Antes de empezar:</strong> dedica 5–8 minutos a caminar suave y mover hombros, caderas y tobillos. La duración seleccionada incluye preparación, descansos y vuelta a la calma; no necesitas entrenar intensamente durante todo ese tiempo.</div>
          ${lista.map((e,i)=>`<div class="casa-exercise"><h4>${i+1}. ${e[0]}</h4><p><strong>${e[1]}</strong></p><p>${e[2]}</p></div>`).join('')}
          ${incluyePausaLarga ? '<div class="casa-exercise"><h4>Descanso y recuperación</h4><p><strong>5–10 minutos según lo necesites</strong></p><p>Alterna bloques de ejercicios con pausas. Bebe agua y recupera la respiración antes de continuar.</p></div>' : ''}
          ${incluyeRecuperacionExtendida ? '<div class="casa-exercise"><h4>Bloque suave opcional</h4><p><strong>10–15 minutos</strong></p><p>Para completar una sesión larga, elige caminata cómoda y movilidad suave. No repitas muchas rondas ni trabajes el mismo grupo muscular intensamente solo para llenar el tiempo.</p></div>' : ''}
          <div class="casa-exercise"><h4>Vuelta a la calma</h4><p><strong>3–5 minutos</strong></p><p>Camina despacio y haz movimientos suaves de brazos y piernas.</p></div>
          <div class="casa-note"><strong>Seguridad:</strong> haz los movimientos a un ritmo cómodo, descansa cuando lo necesites y detente si sientes dolor, mareo o falta de aire inusual. Usa una silla firme y una zona despejada. La duración es orientativa; no hace falta completar todas las rondas si necesitas descansar.</div>
          <button class="btn-volver" onclick="mostrarEntrenamientoCasa()">↻ Cambiar mis opciones</button>
          <button class="btn-principal" style="margin-top:10px;" onclick="mostrarPortada()">Volver al inicio</button>`;
        resultado.classList.add('visible');
        resultado.scrollIntoView({behavior:'smooth',block:'start'});
    }

        if (objetivo) objetivo.value = ['cuerpo','brazos','piernas','movilidad'].includes(tipo) ? tipo : 'cuerpo';
        const resultado = document.getElementById('resultadoCasa');
        if (resultado) resultado.classList.remove('visible');
        generarRutinaCasa();
    }

    function marcarDiaCasa(indice) {
        let completados = {};
        try { completados = JSON.parse(localStorage.getItem('nuraCasaSemana') || '{}'); } catch(e) { completados = {}; }
        completados[indice] = !completados[indice];
        try { localStorage.setItem('nuraCasaSemana', JSON.stringify(completados)); } catch(e) {}
        generarPlanSemanalCasa();
    }

    function reiniciarSemanaCasa() {
        try { localStorage.removeItem('nuraCasaSemana'); } catch(e) {}
        generarPlanSemanalCasa();
    }

    function crearOpcion(campo, valor, titulo, descripcion = "") {

        const seleccionado = datosNura[campo] === valor;

        return `
            <div
                class="opcion ${seleccionado ? "seleccionada" : ""}"
                onclick="seleccionarOpcion('${campo}', '${valor}', this)">

                <input
                    type="radio"
                    name="${campo}"
                    value="${valor}">

                <strong>${titulo}</strong>

                ${descripcion ? `<small>${descripcion}</small>` : ""}

            </div>
        `;
    }


    function seleccionarOpcion(campo, valor, elemento) {

        datosNura[campo] = valor;

        const opciones = elemento.parentElement.querySelectorAll(".opcion");

        opciones.forEach(opcion => {
            opcion.classList.remove("seleccionada");
        });

        elemento.classList.add("seleccionada");

        // Todos los módulos comparten este mismo perfil; Solo correr abre al terminar la configuración.
        guardarPerfilNura();

    }


    function toggleAlimento(tipo, valor) {

        if (tipo === "incluidos") {
            if (datosNura.alimentosIncluidos.includes(valor)) {
                datosNura.alimentosIncluidos = datosNura.alimentosIncluidos.filter(a => a !== valor);
            } else {
                datosNura.alimentosIncluidos.push(valor);
                datosNura.alimentosEvitar = datosNura.alimentosEvitar.filter(a => a !== valor);
            }
        }

        if (tipo === "evitar") {
            if (datosNura.alimentosEvitar.includes(valor)) {
                datosNura.alimentosEvitar = datosNura.alimentosEvitar.filter(a => a !== valor);
            } else {
                datosNura.alimentosEvitar.push(valor);
                datosNura.alimentosIncluidos = datosNura.alimentosIncluidos.filter(a => a !== valor);
            }
        }

        guardarPerfilNura();
        const incluye = document.getElementById(`incluye-${valor}`);
        const evita = document.getElementById(`evita-${valor}`);

        if (incluye) incluye.classList.toggle("seleccionado", datosNura.alimentosIncluidos.includes(valor));
        if (evita) evita.classList.toggle("evitado", datosNura.alimentosEvitar.includes(valor));

        const contador = document.getElementById("contadorIncluidos");
        if (contador) {
            contador.textContent = `${datosNura.alimentosIncluidos.length} ${datosNura.alimentosIncluidos.length === 1 ? "alimento seleccionado" : "alimentos seleccionados"}`;
        }
    }


    function seleccionarTodosAlimentos() {

        datosNura.alimentosIncluidos = alimentosDisponibles
            .map(alimento => alimento[0])
            .filter(valor => !datosNura.alimentosEvitar.includes(valor));

        document.querySelectorAll(".alimento-btn:not(.evitar-btn)").forEach(boton => {
            const valor = boton.id.replace("incluye-", "");
            boton.classList.toggle("seleccionado", datosNura.alimentosIncluidos.includes(valor));
        });

        const contador = document.getElementById("contadorIncluidos");
        if (contador) {
            contador.textContent = `${datosNura.alimentosIncluidos.length} alimentos seleccionados`;
        }
    }


    function seleccionarDia(indice) {

        const dia = diasSemana[indice];

        if (datosNura.dias.includes(dia)) {

            datosNura.dias = datosNura.dias.filter(
                d => d !== dia
            );

        } else {

            datosNura.dias.push(dia);
        }

        const boton = document.getElementById(`dia-${indice}`);

        boton.classList.toggle(
            "seleccionado",
            datosNura.dias.includes(dia)
        );

        actualizarContadorDias();
    }


    function actualizarContadorDias() {

        const contador = document.getElementById("contadorDias");

        if (!contador) {
            return;
        }

        guardarPerfilNura();
        const cantidad = datosNura.dias.length;

        contador.textContent =
            `${cantidad} ${cantidad === 1 ? "día" : "días"} seleccionados`;
    }


    function requiereAlimentacion() {
        return datosNura.planTipo === "alimentacion" || datosNura.planTipo === "ambos";
    }

    function requiereGym() {
        // Casa/parque comparte el flujo principal de configuración y seguimiento.
        return datosNura.planTipo === "gym" || datosNura.planTipo === "casa" || datosNura.planTipo === "correr" || datosNura.planTipo === "ambos";
    }

    function pasoEsRelevante(numero) {
        if (numero === 8) return requiereGym();
        if (numero === 10 || numero === 11) return requiereAlimentacion();
        if (numero === 12) return requiereGym();
        return true;
    }

    function buscarSiguientePaso(desde) {
        for (let i = desde + 1; i <= 12; i++) {
            if (pasoEsRelevante(i)) return i;
        }
        return 13;
    }

    function buscarPasoAnterior(desde) {
        for (let i = desde - 1; i >= 1; i--) {
            if (pasoEsRelevante(i)) return i;
        }
        return 1;
    }

    function obtenerPasosRelevantes() {
        const pasos = [];
        for (let i = 1; i <= 12; i++) {
            if (pasoEsRelevante(i)) pasos.push(i);
        }
        return pasos;
    }


    function guardarPaso() {

        if (pasoActual === 1) {

            const campo = document.getElementById("nombre");

            if (campo) {
                datosNura.nombre = campo.value.trim();
            }

        }

        if (pasoActual === 4) {

            const campo = document.getElementById("edad");

            if (campo) {
                datosNura.edad = campo.value;
            }

        }

        if (pasoActual === 5) {

            const campo = document.getElementById("peso");

            if (campo) {
                datosNura.peso = campo.value.trim();
                datosNura.pesoCompartido = datosNura.peso !== "";
            }

        }

        if (pasoActual === 6) {

            const campo = document.getElementById("altura");

            if (campo) {
                datosNura.altura = campo.value;
            }

        }

        if (pasoActual === 10) {
            // La preferencia alimentaria se guarda directamente al seleccionar la opción.
        }
        guardarPerfilNura();
    }


    function validarPaso() {

        if (pasoActual === 1 && !datosNura.nombre) {

            alert("Escribe tu nombre para continuar.");

            return false;
        }

        if (pasoActual === 1 && !datosNura.planTipo) {

            alert("Elige la opción de NURA que mejor se adapte a ti.");

            return false;
        }


        if (pasoActual === 2 && !datosNura.voz) {

            alert("Selecciona una voz para NURA.");

            return false;
        }


        if (pasoActual === 3 && !datosNura.sexo) {

            alert("Selecciona una opción.");

            return false;
        }


        if (pasoActual === 4 && !datosNura.edad) {

            alert("Indica tu edad.");

            return false;
        }


        if (pasoActual === 6 && !datosNura.altura) {

            alert("Indica tu estatura.");

            return false;
        }


        if (pasoActual === 7 && !datosNura.actividad) {

            alert("Selecciona tu nivel de actividad.");

            return false;
        }


        if (pasoActual === 8 && requiereGym() && !datosNura.experiencia) {

            alert("Selecciona tu experiencia.");

            return false;
        }


        if (pasoActual === 9 && !datosNura.objetivo) {

            alert("Selecciona tu objetivo.");

            return false;
        }


        if (pasoActual === 10 && requiereAlimentacion() && !datosNura.alimentacion) {

            alert("Selecciona tu preferencia alimentaria.");

            return false;
        }


        if (pasoActual === 11 && requiereAlimentacion() && datosNura.alimentosIncluidos.length < 3) {

            alert("Selecciona al menos 3 alimentos que te gustaría incluir.");

            return false;
        }


        if (pasoActual === 12 && requiereGym() && datosNura.dias.length === 0) {

            alert("Selecciona al menos un día para entrenar.");

            return false;
        }


        return true;
    }


    function siguientePaso() {

        guardarPaso();

        if (!validarPaso()) {
            return;
        }

        const siguiente = buscarSiguientePaso(pasoActual);

        if (siguiente <= 12) {
            pasoActual = siguiente;
            actualizarPaso();
        } else {
            generarPlan();
        }
    }


    function anteriorPaso() {

        guardarPaso();

        const anterior = buscarPasoAnterior(pasoActual);

        if (pasoActual > 1) {
            pasoActual = anterior;
            actualizarPaso();
        }
    }


    function actualizarPaso() {

        document.querySelectorAll(".paso").forEach(paso => {
            paso.classList.remove("activo");
        });

        if (!pasoEsRelevante(pasoActual)) {
            pasoActual = buscarSiguientePaso(pasoActual) <= 12 ? buscarSiguientePaso(pasoActual) : 1;
        }

        const paso = document.getElementById(`paso${pasoActual}`);

        if (paso) {
            paso.classList.add("activo");
        }

        const pasos = obtenerPasosRelevantes();
        const posicion = Math.max(0, pasos.indexOf(pasoActual));
        const porcentaje = ((posicion + 1) / pasos.length) * 100;

        const barra = document.getElementById("progresoBarra");

        if (barra) {
            barra.style.width = `${porcentaje}%`;
        }

        const anterior = document.getElementById("btnAnterior");

        if (anterior) {
            anterior.style.visibility = pasoActual === pasos[0] ? "hidden" : "visible";
        }

        const siguiente = document.getElementById("btnSiguiente");

        if (siguiente) {
            siguiente.textContent = posicion === pasos.length - 1 ? "Crear mi plan →" : "Siguiente";
        }

        if (pasoActual === 12) {
            actualizarContadorDias();
        }
    }

    function menuEsCompatible(menu) {

        const evitar = datosNura.alimentosEvitar || [];
        const incluidos = datosNura.alimentosIncluidos || [];

        if (menu.tags.some(tag => evitar.includes(tag))) {
            return false;
        }

        return menu.tags.some(tag => incluidos.includes(tag));
    }


    function obtenerMenuSemana(lista, usados) {

        let disponibles = lista.filter(menuEsCompatible);

        if (disponibles.length === 0) {
            disponibles = lista.filter(menu => !menu.tags.some(tag => (datosNura.alimentosEvitar || []).includes(tag)));
        }

        if (disponibles.length === 0) {
            disponibles = lista;
        }

        const noUsados = disponibles.filter(menu => !usados.includes(menu.texto));
        const pool = noUsados.length ? noUsados : disponibles;
        const elegido = pool[Math.floor(Math.random() * pool.length)];

        usados.push(elegido.texto);
        return elegido.texto;
    }

            mostrarModuloCorrer();
            return;

        const letrasSesiones = ["A", "B", "C", "D"];
        let numeroSesion = 0;
        const usadosDesayuno = [];
        const usadosComida = [];
        const usadosCena = [];
        const usadosBebidaDesayuno = [];
        const usadosBebidaComida = [];
        const usadosBebidaCena = [];

        const semana = diasSemana.map(dia => {

            const entrenar = datosNura.dias.includes(dia);

                ? letrasSesiones[numeroSesion % letrasSesiones.length]

            }

            return {
                dia,

                sesion: letraSesion,
                desayuno: requiereAlimentacion() ? obtenerMenuSemana(menuDesayuno, usadosDesayuno) : null,
                bebidaDesayuno: requiereAlimentacion() ? obtenerBebida(bebidasDesayuno, usadosBebidaDesayuno) : null,

                bebidaCena: requiereAlimentacion() ? obtenerBebida(bebidasCena, usadosBebidaCena) : null
            };
        });

    }

    let nuraRunTimer = { activo:false, inicio:0, acumulado:0, watchId:null, ultimoPunto:null, metros:0, intervalo:null };
    function tiempoCarreraMs() { return nuraRunTimer.acumulado + (nuraRunTimer.activo ? Date.now()-nuraRunTimer.inicio : 0); }
    function formatoTiempoCarrera(ms) { const t=Math.floor(Math.max(0,ms)/1000), h=Math.floor(t/3600), m=Math.floor((t%3600)/60), sec=t%60; return [h,m,sec].map(v=>String(v).padStart(2,'0')).join(':'); }
    function actualizarVistaCronometro() {
      const display=document.getElementById('runTimerDisplay'); if(!display) return;
      display.textContent=formatoTiempoCarrera(tiempoCarreraMs());
      const km=nuraRunTimer.metros/1000; const dist=document.getElementById('runGpsDistance'); if(dist) dist.textContent=km.toFixed(2)+' km';
      const pace=document.getElementById('runPace'); if(pace) { const mins=tiempoCarreraMs()/60000; pace.textContent=km>0&&mins>0 ? (Math.floor(mins/km)+':'+String(Math.floor((mins/km%1)*60).toString()).padStart(2,'0')+' /km') : '--:-- /km'; }
      const start=document.getElementById('runStartBtn'), pause=document.getElementById('runPauseBtn'); if(start) start.disabled=nuraRunTimer.activo; if(pause) pause.disabled=!nuraRunTimer.activo;
    }
    function iniciarCronometroCarrera() {
      if(nuraRunTimer.activo) return;
      nuraRunTimer.inicio=Date.now(); nuraRunTimer.activo=true;
      if(!nuraRunTimer.intervalo) nuraRunTimer.intervalo=setInterval(actualizarVistaCronometro,500);
      const status=document.getElementById('runGpsStatus');
      if(nuraRunTimer.watchId===null && navigator.geolocation) {
        nuraRunTimer.ultimoPunto=null;
        nuraRunTimer.watchId=navigator.geolocation.watchPosition(pos=>{
          const c=pos.coords; if(c.accuracy && c.accuracy>60) return;
          const punto={lat:c.latitude,lon:c.longitude};
          if(nuraRunTimer.ultimoPunto) { const a=nuraRunTimer.ultimoPunto; const rad=x=>x*Math.PI/180; const dLat=rad(punto.lat-a.lat), dLon=rad(punto.lon-a.lon); const q=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(punto.lat))*Math.sin(dLon/2)**2; const m=6371000*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q)); if(m<150) nuraRunTimer.metros+=m; }
          nuraRunTimer.ultimoPunto=punto; actualizarVistaCronometro(); if(status) status.textContent='GPS activo. La distancia es aproximada y depende de la señal.';
        },err=>{ if(status) status.textContent='No se pudo usar el GPS. Puedes introducir la distancia manualmente al finalizar.'; nuraRunTimer.watchId=-1; },{enableHighAccuracy:true,maximumAge:2000,timeout:10000});
      } else if(status && !navigator.geolocation) status.textContent='Este navegador no ofrece GPS. Puedes introducir la distancia manualmente.';
      actualizarVistaCronometro();
    }
    function pausarCronometroCarrera() {
      if(!nuraRunTimer.activo) return; nuraRunTimer.acumulado+=Date.now()-nuraRunTimer.inicio; nuraRunTimer.activo=false; actualizarVistaCronometro();
      const status=document.getElementById('runGpsStatus'); if(status) status.textContent='Cronómetro pausado.';
    }
    function finalizarCarrera() {
      if(nuraRunTimer.activo) pausarCronometroCarrera();
      const input=document.getElementById('runManualDistance'); const manual=Number(input?.value||0); const km=nuraRunTimer.metros/1000; const distancia=km>0?km:manual; const ms=nuraRunTimer.acumulado;
      if(ms<=0) { alert('Primero inicia el cronómetro para registrar una sesión.'); return; }
      if(distancia<=0) { alert('No se detectó distancia por GPS. Introduce los kilómetros recorridos para guardar el registro.'); return; }
      let logs=[]; try { logs=JSON.parse(localStorage.getItem('nuraRunRegistros')||'[]'); } catch(e){}
      logs.push({fecha:new Date().toISOString(),ms,km:Number(distancia.toFixed(2)),objetivo:window.nuraRunObjetivo||'5',nivel:window.nuraRunNivel||datosNura.experiencia||'principiante'});
      try { localStorage.setItem('nuraRunRegistros',JSON.stringify(logs)); } catch(e) { alert('No se pudo guardar el registro en este navegador.'); return; }
      if(nuraRunTimer.watchId!==null && nuraRunTimer.watchId>=0 && navigator.geolocation) navigator.geolocation.clearWatch(nuraRunTimer.watchId);
      if(nuraRunTimer.intervalo) clearInterval(nuraRunTimer.intervalo);
      nuraRunTimer={activo:false,inicio:0,acumulado:0,watchId:null,ultimoPunto:null,metros:0,intervalo:null};
      if(input) input.value=''; actualizarVistaCronometro(); renderizarProgresoCarrera(); alert('¡Carrera guardada! Tu progreso semanal se ha actualizado.');
    }
    function renderizarProgresoCarrera() {
      const el=document.getElementById('runProgressCard'); if(!el) return; let logs=[]; try { logs=JSON.parse(localStorage.getItem('nuraRunRegistros')||'[]'); } catch(e){}
      const ahora=new Date(); const inicioSemana=new Date(ahora); const dia=(ahora.getDay()+6)%7; inicioSemana.setHours(0,0,0,0); inicioSemana.setDate(ahora.getDate()-dia);
      const semana=logs.filter(x=>new Date(x.fecha)>=inicioSemana); const totalKm=semana.reduce((a,x)=>a+Number(x.km||0),0); const totalMs=semana.reduce((a,x)=>a+Number(x.ms||0),0);

    function obtenerDatosEjercicio(ejercicio) {

        const texto = ejercicio[1] || "";
        const coincidencia = texto.match(/^(\d+)\s+series\s+×\s+(.+)$/i);

        if (!coincidencia) {
            return {
                nombre: ejercicio[0],
                series: 1,
                objetivo: texto
            };
        }

        return {
            nombre: ejercicio[0],
            series: obtenerSeriesParaNivel(),
            objetivo: coincidencia[2]
        };
    }

            return ejercicio[1];
        }

        return `${datos.series} series × ${datos.objetivo}`;

        const opciones = compatibles.length ? compatibles : lista.filter(menu => !menu.tags.some(tag => (datosNura.alimentosEvitar || []).includes(tag)) && menu.texto !== actual);

        if (!opciones.length) return;

        const nueva = opciones[Math.floor(Math.random() * opciones.length)];

        if (intervaloTimer) {

    function comenzarPreparacion(segundosTotales) {

        if (intervaloTimer) {
            clearInterval(intervaloTimer);

        let segundos = segundosTotales;
        const timer = document.getElementById("timer");

        if (!timer) {
            return;
        }

        timer.textContent = formatearTiempo(segundos);

        intervaloTimer = setInterval(() => {
            segundos--;
            timer.textContent = formatearTiempo(segundos);

            if (segundos <= 0) {
                clearInterval(intervaloTimer);
                intervaloTimer = null;
                alert("¡Preparación terminada! Vamos con tu entrenamiento. 💪");
                mostrarEntrenamiento();
            }
        }, 1000);

            serieActual = 1;
            ejercicioActual++;

    function guardarSesionEnHistorial(minutosSesion, rutina) {

        const momento = window.momentoCardioNura || "ninguno";
        const maquina = indiceDiaActual !== null
            ? datosNura.preparacionMaquina[indiceDiaActual]
            : null;

        const encontrada = maquinasPreparacion.find(item => item[0] === maquina);

        const registro = {
            fecha: new Date().toLocaleString("es-MX", {
                dateStyle: "medium",
                timeStyle: "short"
            }),
            timestamp: new Date().toISOString(),
            sesion: sesionActual,
            rutina: rutina.nombre,
            minutos: minutosSesion,
            ejercicios: rutina.ejercicios.length,
            series: seriesCompletadasSesion,
            cardio: momento === "inicio" ? "Al inicio" : momento === "final" ? "Al final" : "Sin cardio",
            maquina: encontrada ? encontrada[1] : "Sin máquina"
        };

        historialNura.unshift(registro);
        historialNura = historialNura.slice(0, 10);

        try {
            localStorage.setItem("nuraHistorial", JSON.stringify(historialNura));
        } catch (e) {
            // Si el navegador bloquea almacenamiento local, la sesión continúa normalmente.
        }
    }


    function obtenerFechaRegistro(item) {

        if (item.timestamp) {
            const fecha = new Date(item.timestamp);
            if (!isNaN(fecha.getTime())) return fecha;
        }

        const fechaAnterior = new Date(item.fecha);
        return isNaN(fechaAnterior.getTime()) ? null : fechaAnterior;
    }


    function obtenerInicioSemana() {

        const hoy = new Date();
        const inicio = new Date(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
        const dia = inicio.getDay();
        const diferencia = dia === 0 ? 6 : dia - 1;
        inicio.setDate(inicio.getDate() - diferencia);
        inicio.setHours(0, 0, 0, 0);
        return inicio;
    }


    function obtenerSesionesSemana() {

        const inicioSemana = obtenerInicioSemana();

        return historialNura.filter(item => {
            const fecha = obtenerFechaRegistro(item);
            if (!fecha) return false;

            // Comparamos solo la fecha calendario local para evitar que la
            // conversión UTC del timestamp mueva una sesión al día anterior.
            const fechaLocal = new Date(
                fecha.getFullYear(),
                fecha.getMonth(),
                fecha.getDate()
            );

            return fechaLocal >= inicioSemana;
        });
    }

            return `¡Buen comienzo! Llevas ${totalSemana} de ${objetivoSemana} sesiones esta semana. Te faltan ${faltan} para completar los días que elegiste.`;

        return `¡Buen comienzo! Ya llevas ${totalSemana} sesión${totalSemana === 1 ? "" : "es"} registrada${totalSemana === 1 ? "" : "s"}.`;

       VOZ / FUTURO ASISTENTE

    let reconocimientoNura = null;
    let escuchandoNura = false;
    let vozActivaNura = false;
    let vozHablandoNura = false;
    let reinicioVozNura = null;
    let saludoInicialNura = false;

    function obtenerVozNura() {
        if (!("speechSynthesis" in window)) return null;

        const voces = window.speechSynthesis.getVoices();
        const esMX = voces.filter(v => /^es-MX/i.test(v.lang));
        const espanolas = voces.filter(v => /^es(-|_)/i.test(v.lang));
        const disponibles = esMX.length ? esMX : (espanolas.length ? espanolas : voces);
        const preferencia = datosNura.voz || "femenina";

        const femeninas = /dalia.*(online|natural)|dalia|ximena.*(online|natural)|ximena|valeria.*(online|natural)|valeria|beatriz|candela|carlota|larissa|nuria|renata|sabina|helena|elena|paulina|monica|mónica|sofia|sofía|female|femenina|mujer|woman|google español|spanish.*female/i;
        const masculinas = /jorge|tristan|alejo|pablo|diego|raul|raúl|carlos|male|masculina|hombre|man|spanish.*male/i;

        if (preferencia === "femenina") {
            return disponibles.find(v => /microsoft.*dalia.*(natural|online)|dalia.*(natural|online)/i.test(v.name)) ||
                   disponibles.find(v => /microsoft.*ximena.*(natural|online)|ximena.*(natural|online)/i.test(v.name)) ||
                   disponibles.find(v => /microsoft.*valeria.*(natural|online)|valeria.*(natural|online)/i.test(v.name)) ||
                   disponibles.find(v => femeninas.test(v.name)) ||
                   disponibles.find(v => !masculinas.test(v.name)) || disponibles[0] || null;
        }

        if (preferencia === "masculina") {
            return disponibles.find(v => masculinas.test(v.name)) || disponibles.find(v => !femeninas.test(v.name)) || disponibles[0] || null;
        }

        return disponibles.find(v => !masculinas.test(v.name)) || disponibles[0] || null;
    }

    function actualizarEstadoVozNura(texto) {
        const estado = document.getElementById("estadoVozNura");
        if (estado) estado.textContent = texto;
    }

    function programarEscuchaNura() {
        if (!vozActivaNura || !reconocimientoNura || vozHablandoNura) return;
        clearTimeout(reinicioVozNura);
        reinicioVozNura = setTimeout(() => {
            if (!vozActivaNura || escuchandoNura || vozHablandoNura) return;
            try { reconocimientoNura.start(); } catch (e) {}
        }, 350);
    }

    function hablarConNura() {
        saludoInicialNura = false;
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

        document.body.insertAdjacentHTML("beforeend", `
            <div class="voz-panel" id="panelVozNura" onclick="cerrarVozNura(event)">
                <div class="voz-card" onclick="event.stopPropagation()">
                    <div class="logo">NURA</div>
                    <div class="voz-orb" id="orbVozNura">🎙️</div>
                    <h2>Habla con NURA</h2>
                    <div class="voz-estado" id="estadoVozNura">Activa la conversación una sola vez y después habla con NURA con naturalidad.</div>
                    <div class="voz-transcripcion" id="textoVozNura">Aquí aparecerá lo que NURA entienda.</div>
                    <button id="btnVozNura" class="btn-principal" onclick="alternarEscuchaNura()">🎙️ Activar conversación</button>
                    <button class="btn-siguiente" style="margin-top:10px;width:100%;" onclick="cerrarVozNura()">Cerrar</button>
                    <div class="voz-ayuda">Después de activarla, NURA vuelve a escucharte automáticamente después de cada respuesta. No tendrás que pulsar el botón en cada turno.</div>
                </div>
            </div>
        `);

        if (!SpeechRecognition) {
            actualizarEstadoVozNura("Este navegador no permite reconocimiento de voz aquí. Prueba con Chrome o Edge en un dispositivo compatible.");
            document.getElementById("orbVozNura").textContent = "ℹ️";
            return;
        }

        reconocimientoNura = new SpeechRecognition();
        reconocimientoNura.lang = "es-MX";
        reconocimientoNura.continuous = true;
        reconocimientoNura.interimResults = false;
        reconocimientoNura.maxAlternatives = 1;

        reconocimientoNura.onstart = () => {
            escuchandoNura = true;
            actualizarEstadoVozNura("Te escucho… habla con naturalidad.");
            const orb = document.getElementById("orbVozNura");
            if (orb) orb.classList.add("escuchando");
        };

        reconocimientoNura.onresult = (event) => {
            let texto = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                if (event.results[i].isFinal) texto += event.results[i][0].transcript + " ";
            }
            texto = texto.trim();
            if (!texto) return;

            const caja = document.getElementById("textoVozNura");
            if (caja) caja.textContent = texto;
            responderVozNura(texto);
        };

        reconocimientoNura.onerror = (event) => {
            escuchandoNura = false;
            const orb = document.getElementById("orbVozNura");
            if (orb) orb.classList.remove("escuchando");

            if (event.error === "not-allowed" || event.error === "service-not-allowed") {
                vozActivaNura = false;
                actualizarEstadoVozNura("Necesito permiso para usar el micrófono. Puedes activarlo desde los permisos del navegador.");
                const boton = document.getElementById("btnVozNura");
                if (boton) boton.textContent = "🎙️ Activar conversación";
                return;
            }

            if (vozActivaNura && !vozHablandoNura) {
                actualizarEstadoVozNura("Sigo aquí. Te escucho…");
                programarEscuchaNura();
            }
        };

        reconocimientoNura.onend = () => {
            escuchandoNura = false;
            const orb = document.getElementById("orbVozNura");
            if (orb) orb.classList.remove("escuchando");
            if (vozActivaNura && !vozHablandoNura) programarEscuchaNura();
        };

        if ("speechSynthesis" in window) {
            window.speechSynthesis.onvoiceschanged = () => {};
            window.speechSynthesis.getVoices();
        }
    }

    function alternarEscuchaNura() {
        if (!reconocimientoNura) return;

        if (vozActivaNura) {
            vozActivaNura = false;
            clearTimeout(reinicioVozNura);
            if (escuchandoNura) {
                try { reconocimientoNura.stop(); } catch (e) {}
            }
            actualizarEstadoVozNura("Conversación pausada.");
            const boton = document.getElementById("btnVozNura");
            if (boton) boton.textContent = "🎙️ Activar conversación";
            return;
        }

        vozActivaNura = true;
        const boton = document.getElementById("btnVozNura");
        if (boton) boton.textContent = "⏸️ Pausar conversación";

        const iniciarEscuchaDespuesDelSaludo = () => {
            if (!vozActivaNura) return;
            actualizarEstadoVozNura("Te escucho…");
            try {
                reconocimientoNura.start();
            } catch (e) {
                programarEscuchaNura();
            }
        };

        if (!saludoInicialNura) {
            saludoInicialNura = true;
            const nombre = datosNura.nombre || "amigo";
            const saludos = [
                `Hola ${nombre}, ¿cómo has estado? ¿Qué tal tu día? Dime, ¿qué indicaciones tienes para mí o en qué puedo ayudarte hoy?`,
                `Hola ${nombre}. Qué gusto escucharte. ¿Cómo va tu día? Cuéntame, ¿qué necesitas de NURA?`,
                `Hola ${nombre}, aquí estoy. ¿Cómo estás? Dime qué tienes en mente y vemos juntos en qué puedo ayudarte.`,
                `Hola ${nombre}. Ya estoy lista para escucharte. ¿Qué te gustaría hacer hoy con NURA?`
            ];
            const saludo = saludos[Math.floor(Math.random() * saludos.length)];
            actualizarEstadoVozNura(saludo);
            hablarTextoNaturalNura(saludo, iniciarEscuchaDespuesDelSaludo);
        } else {
            iniciarEscuchaDespuesDelSaludo();
        }
    }

    function obtenerDiaSolicitadoVoz(texto) {
        const t = texto.toLowerCase();
        const equivalencias = {
            "lunes": "Lunes",
            "martes": "Martes",
            "miércoles": "Miércoles",
            "miercoles": "Miércoles",
            "jueves": "Jueves",
            "viernes": "Viernes",
            "sábado": "Sábado",
            "sabado": "Sábado",
            "domingo": "Domingo"
        };

        for (const clave in equivalencias) {
            if (t.includes(clave)) return equivalencias[clave];
        }

        const hoy = diasSemana[new Date().getDay() === 0 ? 6 : new Date().getDay() - 1];
        if (t.includes("hoy")) return hoy;

        return hoy;
    }
