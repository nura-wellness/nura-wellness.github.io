    function extraerElementoNoDisponible(texto) {
        const t = normalizarAlimentoNura(texto);
        const patrones = [
            /ya\s+no\s+tengo\s+([^,.!?]+)/i,
            /no\s+cuento\s+con\s+([^,.!?]+)/i,
            /no\s+tengo\s+([^,.!?]+)/i,
            /no\s+hay\s+([^,.!?]+)/i,
            /se\s+me\s+acabo\s+([^,.!?]+)/i
        ];
        for (const patron of patrones) {
            const m = t.match(patron);
            if (m) return m[1].trim();
        }
        return "";
    }

    function detectarAlimentoNoDisponible(texto) {
        const frase = extraerElementoNoDisponible(texto);
        for (const clave of Object.keys(nombresAlimentosNura)) {
            if (frase.includes(normalizarAlimentoNura(clave))) return clave;
        }
        return null;
    }

    const bebidasNura = [
        { claves:["agua simple","agua"], valor:"💧 Agua simple" },
        { claves:["agua de sabor","agua fresca"], valor:"💧 Agua de sabor sin azúcar" },
        { claves:["cafe","café"], valor:"☕ Café" },
        { claves:["te","té","te sin azucar","té sin azúcar"], valor:"🍵 Té sin azúcar" },
        { claves:["refresco zero","zero","refresco sin azucar","refresco sin azúcar","refresco de dieta"], valor:"🥤 Refresco sin azúcar / zero" },
        { claves:["refresco normal","refresco"], valor:"🥤 Refresco normal (ocasional)" }
    ];

    function detectarBebidaEnTexto(texto) {
        const t = normalizarAlimentoNura(texto);
        // Priorizar frases específicas antes de términos generales como "agua" o "refresco".
        const orden = [...bebidasNura].sort((a,b) => Math.max(...b.claves.map(x=>x.length))-Math.max(...a.claves.map(x=>x.length)));
        for (const bebida of orden) {
            if (bebida.claves.some(clave => t.includes(normalizarAlimentoNura(clave)))) return bebida;
        }
        return null;
    }

    function aplicarCambioBebidaPendiente(texto) {
        const pendiente = window.__nuraPendienteBebida;
        if (!pendiente) return null;
        const bebida = detectarBebidaEnTexto(texto);
        if (!bebida) return "Perfecto, dime qué bebida tienes disponible: agua simple, agua de sabor, café, té u otra bebida.";
        const dia = planSemanalActual.find(d => d.dia === pendiente.dia);
        if (!dia) { window.__nuraPendienteBebida = null; return "No encontré ese día en tu plan. Dime qué día quieres ajustar."; }
        const campo = `bebida${pendiente.tipo.charAt(0).toUpperCase()}${pendiente.tipo.slice(1)}`;
        dia[campo] = bebida.valor;
        window.__nuraPendienteBebida = null;
        try { localStorage.setItem("nuraPlanSemanal", JSON.stringify(planSemanalActual)); } catch (e) {}
        mostrarPlanSemanal(planSemanalActual);
        return `Listo. Cambié la bebida del ${pendiente.tipo} del ${dia.dia} por ${bebida.valor}. El resto del menú se queda igual.`;
    }

    function alimentoPermitidoParaSustitucion(nombre) {
        const mapa = {
            "pollo":"pollo", "carne":"carne", "pescado":"pescado", "atún":"atun", "huevo":"huevo",
            "queso":"queso", "leche":"leche", "frijoles":"frijoles", "lentejas":"lentejas", "arroz":"arroz",
            "avena":"avena", "tortilla":"tortilla", "pan":"pan", "pasta":"pasta", "papa":"papa",
            "verduras":"verduras", "frutas":"frutas", "aguacate":"aguacate", "nueces y semillas":"nueces", "yogur":"yogur", "tostadas":"tostadas"
        };
        const clave = mapa[nombre] || nombre;
        return !(datosNura.alimentosEvitar || []).includes(clave);
    }

    function normalizarAlimentoNura(texto) {
        return (texto || "")
            .toLowerCase()
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .trim();
    }

    function alimentosMencionadosEnTexto(texto) {
        const t = normalizarAlimentoNura(texto);
        const equivalencias = [
            ["jamon", "jamón"], ["salchicha", "salchicha"], ["huevo", "huevo"], ["huevos", "huevo"],
            ["queso", "queso"], ["pollo", "pollo"], ["carne", "carne"], ["atun", "atún"], ["pescado", "pescado"],
            ["frijoles", "frijoles"], ["lentejas", "lentejas"], ["arroz", "arroz"], ["tortillas", "tortillas"], ["tortilla", "tortillas"],
            ["pan", "pan"], ["bolillo", "bolillo"], ["papa", "papa"], ["pasta", "pasta"], ["avena", "avena"],
            ["leche", "leche"], ["yogur", "yogur"], ["aguacate", "aguacate"], ["jitomate", "jitomate"], ["tomate", "tomate"],
            ["cebolla", "cebolla"], ["champiñones", "champiñones"], ["champinones", "champiñones"], ["espinaca", "espinaca"],
            ["nopales", "nopales"], ["pepino", "pepino"], ["zanahoria", "zanahoria"], ["lechuga", "lechuga"], ["manzana", "manzana"],
            ["platano", "plátano"], ["platano", "plátano"], ["fruta", "fruta"], ["verduras", "verduras"], ["salmon", "salmón"],
            ["pavo", "pavo"], ["cerdo", "cerdo"], ["camaron", "camarón"], ["sardina", "sardina"], ["tofu", "tofu"],
            ["galletas", "galletas saladas"], ["tostadas", "tostadas"], ["crema", "crema"], ["mayonesa", "mayonesa"]
        ];
        const encontrados = [];
        for (const [clave, nombre] of equivalencias) {
            if (t.includes(clave) && !encontrados.includes(nombre)) encontrados.push(nombre);
        }
        return encontrados;
    }

    function alimentoMencionadoEnTexto(texto) {
        return alimentosMencionadosEnTexto(texto)[0] || null;
    }

    function buscarSustitutoDisponible(alimento) {
        const opciones = sustitucionesAlimentos[alimento] || [];
        const permitidas = opciones.filter(opcion => {
            const clave = normalizarAlimentoNura(opcion);
            return !["verduras disponibles","ensalada","otra verdura","otra fruta","otra grasa disponible","aceite de oliva","semillas","leche vegetal","agua","garbanzos"].includes(clave) && alimentoPermitidoParaSustitucion(opcion);
        });
        return permitidas[0] || null;
    }

    function reemplazarAlimentoEnDia(dia, tipo, alimentoNoDisponible, sustituto) {
        if (!dia || !dia[tipo]) return false;
        const texto = dia[tipo];
        const patrones = {
            atun: /at[uú]n/gi,
            salmon: /salm[oó]n/gi,
            tostadas: /tostadas?/gi
        };
        const objetivo = patrones[alimentoNoDisponible] || new RegExp(alimentoNoDisponible, "gi");
        if (!objetivo.test(texto)) return false;
        objetivo.lastIndex = 0;
        dia[tipo] = texto.replace(objetivo, sustituto);
        return true;
    }

    function aplicarSustitucionEnPlan(alimentoNoDisponible, sustituto) {
        if (!planSemanalActual.length || !sustituto) return 0;
        let cambios = 0;
        const diaObjetivo = obtenerDiaSolicitadoVoz("hoy");
        const diasObjetivo = planSemanalActual.filter(d => d.dia === diaObjetivo);
        const revisar = diasObjetivo.length ? diasObjetivo : planSemanalActual;
        const t = normalizarAlimentoNura(window.__nuraTextoActual || "");
        let tiposObjetivo = ["desayuno", "comida", "cena"];

        if (t.includes("cena") || t.includes("cenar")) {
            tiposObjetivo = ["cena"];
        } else if (t.includes("desayuno") || t.includes("desayunar")) {
            tiposObjetivo = ["desayuno"];
        } else if (t.includes("comida") || t.includes("comer") || t.includes("almuerzo")) {
            tiposObjetivo = ["comida"];
        }

        revisar.forEach(dia => {
            tiposObjetivo.forEach(tipo => {
                if (reemplazarAlimentoEnDia(dia, tipo, alimentoNoDisponible, sustituto)) cambios++;
            });
        });

        if (cambios > 0) {
            try { localStorage.setItem("nuraPlanSemanal", JSON.stringify(planSemanalActual)); } catch (e) {}
            if (typeof mostrarPlanSemanal === "function") mostrarPlanSemanal(planSemanalActual);
        }
        return cambios;
    }

    function obtenerResumenAlimentacionVoz(texto) {
        if (!planSemanalActual.length) {
            return "Todavía no tengo una semana generada para consultarte la alimentación. Primero crea tu plan semanal y después puedes preguntarme qué desayunar, qué comer o qué cenar.";
        }

        const diaSolicitado = obtenerDiaSolicitadoVoz(texto);
        const dia = planSemanalActual.find(item => item.dia === diaSolicitado) || planSemanalActual[0];
        const t = normalizarAlimentoNura(texto);
        window.__nuraTextoActual = texto;

        // Si NURA estaba esperando que el usuario dijera qué bebida tiene, resolverlo primero.
        const cambioBebidaPendiente = aplicarCambioBebidaPendiente(texto);
        if (cambioBebidaPendiente) return cambioBebidaPendiente;
        // Resolver una sustitución pendiente con los ingredientes que el usuario sí tiene.
        const pendienteComida = window.__nuraPendienteAlimento;
        if (pendienteComida) {
            const disponibles = alimentosMencionadosEnTexto(texto).filter(x => !["verduras", "fruta"].includes(x));
            if (!disponibles.length) {
                return "Dime los ingredientes que sí tienes, por ejemplo huevo, jamón, salchicha, queso, tortillas o pan. Con eso te propongo una comida distinta sin repetir toda la semana.";
            }
            const diaPendiente = planSemanalActual.find(d => d.dia === pendienteComida.dia);
            if (!diaPendiente) {
                window.__nuraPendienteAlimento = null;
                return "No encontré ese día del menú. Dime qué día quieres ajustar y lo hacemos.";
            }
            const tipoPendiente = pendienteComida.tipo || "comida";
            const ingredientes = disponibles.slice(0, 3);
            let platillo = "";
            const tiene = x => ingredientes.some(i => normalizarAlimentoNura(i).includes(normalizarAlimentoNura(x)));
            if (tiene("huevo") && (tiene("jamón") || tiene("salchicha"))) {
                const extras = ingredientes.filter(i => i !== "huevo");
                platillo = `Huevos revueltos con ${extras.join(" y ")}`;
            } else if (tiene("jamón") && tiene("queso")) {
                platillo = "Sándwich de jamón y queso";
            } else if (tiene("salchicha") && tiene("tortillas")) {
                platillo = "Tacos de salchicha";
            } else if (tiene("huevo")) {
                platillo = "Huevos preparados al gusto";
            } else {
                platillo = `Platillo sencillo con ${ingredientes.join(" y ")}`;
            }
            const campoComida = tipoPendiente;
            diaPendiente[campoComida] = platillo + ".";
            window.__nuraPendienteAlimento = null;
            try { localStorage.setItem("nuraPlanSemanal", JSON.stringify(planSemanalActual)); } catch (e) {}
            mostrarPlanSemanal(planSemanalActual);
            return `Perfecto, con lo que tienes te propongo ${platillo.toLowerCase()}. Actualicé únicamente la comida del ${diaPendiente.dia}; el resto de tu menú se conserva.`;
        }

        const fraseNoDisponible = extraerElementoNoDisponible(texto);
        const bebidaNoDisponible = detectarBebidaEnTexto(fraseNoDisponible);
        if (fraseNoDisponible && bebidaNoDisponible) {
            let tipoBebida = null;
            if (t.includes("desayuno") || t.includes("desayunar")) tipoBebida = "desayuno";
            else if (t.includes("comida") || t.includes("comer") || t.includes("almuerzo")) tipoBebida = "comida";
            else if (t.includes("cena") || t.includes("cenar")) tipoBebida = "cena";
            else {
                tipoBebida = ["desayuno","comida","cena"].find(tipo => normalizarAlimentoNura(dia[`bebida${tipo.charAt(0).toUpperCase()}${tipo.slice(1)}`] || "").includes(normalizarAlimentoNura(bebidaNoDisponible.valor.replace(/^\S+\s*/, "")))) || "desayuno";
            }
            window.__nuraPendienteBebida = { dia: dia.dia, tipo: tipoBebida };
            return `No pasa nada. ¿Qué bebidas tienes disponibles? Por ejemplo, agua simple, agua de sabor, café u otra. Cambiaré únicamente la bebida del ${tipoBebida} del ${dia.dia}; tu comida se queda igual.`;
        }

        const noDisponible = detectarAlimentoNoDisponible(texto);

        if (noDisponible === "verduras" || noDisponible === "frutas") {
            let tipoPendiente = "comida";
            if (t.includes("desayuno") || t.includes("desayunar")) tipoPendiente = "desayuno";
            else if (t.includes("cena") || t.includes("cenar")) tipoPendiente = "cena";
            else if (t.includes("comida") || t.includes("comer") || t.includes("almuerzo")) tipoPendiente = "comida";
            window.__nuraPendienteAlimento = { dia: dia.dia, tipo: tipoPendiente, alimento: noDisponible };
            return `No hay problema. Vamos a cambiar solo esa comida del ${dia.dia}. ¿Qué ingredientes sí tienes a la mano? Puedes decirme varios, como huevo, jamón, salchicha, queso, tortillas o pan.`;
        }

        if (noDisponible) {
            const sustituto = buscarSustitutoDisponible(noDisponible);
            if (sustituto) {
                const cambios = aplicarSustitucionEnPlan(noDisponible, sustituto);
                if (cambios) {
                    return `Claro. No pasa nada. Cambié ${nombresAlimentosNura[noDisponible] || noDisponible} por ${sustituto} en las comidas donde aparecía. Si tampoco tienes ${sustituto}, dime qué alimentos sí tienes y buscamos otra opción.`;
                }
                return `No pasa nada. Podemos cambiar ${nombresAlimentosNura[noDisponible] || noDisponible} por ${sustituto}. Si me dices qué alimentos tienes disponibles, te propongo otra opción.`;
            }
            return `No quiero inventarte una sustitución. Dime qué alimentos sí tienes disponibles y buscamos juntos una alternativa para esa comida.`;
        }

        // Si el usuario responde solamente con un alimento disponible, por ejemplo
        // "tengo huevo", lo usamos como respuesta a una sustitución pendiente.
        if (t.includes("tengo ") || t.includes("sí tengo ") || t.includes("si tengo ") || t.includes("cuento con ")) {
            const alimentos = alimentosMencionadosEnTexto(texto);
            if (alimentos.length) {
                return `Anotado: tienes ${alimentos.join(", ")}. Dime qué platillo o ingrediente quieres sustituir y ajustaré solo esa comida, sin repetir el menú semanal.`;
            }
        }

        const preguntaBebida = t.includes("bebida") || t.includes("tomar") || t.includes("qué tomo") || t.includes("que tomo") || t.includes("qué voy a tomar") || t.includes("que voy a tomar");

        if (preguntaBebida) {
            if (t.includes("desayuno") || t.includes("desayunar")) return `En el desayuno puedes tomar: ${dia.bebidaDesayuno || "agua simple"}.`;
            if (t.includes("comida") || t.includes("comer") || t.includes("almuerzo")) return `Con la comida puedes tomar: ${dia.bebidaComida || "agua simple"}.`;
            if (t.includes("cena") || t.includes("cenar")) return `Con la cena puedes tomar: ${dia.bebidaCena || "agua simple"}.`;
            return `Hoy NURA te sugiere ${dia.bebidaDesayuno || "agua simple"} en el desayuno, ${dia.bebidaComida || "agua simple"} con la comida y ${dia.bebidaCena || "agua simple"} con la cena.`;
        }

        if (t.includes("desayuno") || t.includes("desayunar")) {
            return `Para ${dia.dia}, tu desayuno es: ${dia.desayuno}. Y para tomar, ${dia.bebidaDesayuno || "agua simple"}.`;
        }

        if (t.includes("cena") || t.includes("cenar")) {
            return `Para ${dia.dia}, tu cena es: ${dia.cena}. Y para tomar, ${dia.bebidaCena || "agua simple"}.`;
        }

        if (t.includes("comida") || t.includes("comer") || t.includes("almuerzo")) {
            return `Para ${dia.dia}, tu comida es: ${dia.comida}. Y para tomar, ${dia.bebidaComida || "agua simple"}.`;
        }

        return `Para ${dia.dia}, tu alimentación es: desayuno, ${dia.desayuno}; comida, ${dia.comida}; y cena, ${dia.cena}. Para tomar: ${dia.bebidaDesayuno || "agua simple"} en el desayuno, ${dia.bebidaComida || "agua simple"} con la comida y ${dia.bebidaCena || "agua simple"} con la cena.`;
    }

    function dividirTextoParaHablar(texto) {
        return texto
            .replace(/\s+/g, " ")
            .split(/(?<=[.!?])\s+/)
            .map(x => x.trim())
            .filter(Boolean);
    }

    function hablarTextoNaturalNura(texto, alTerminar) {
        if (!("speechSynthesis" in window)) {
            if (alTerminar) alTerminar();
            return;
        }

        const partes = dividirTextoParaHablar(texto);
        let indice = 0;
        window.speechSynthesis.cancel();

        const siguiente = () => {
            if (indice >= partes.length) {
                if (alTerminar) alTerminar();
                return;
            }

            const parte = partes[indice++];
            const voz = new SpeechSynthesisUtterance(parte);
            voz.lang = "es-MX";
            voz.rate = 0.86;
            voz.pitch = 1.0;
            voz.volume = 1;

            const vozNura = obtenerVozNura();
            if (vozNura) voz.voice = vozNura;

            voz.onstart = () => {
                vozHablandoNura = true;
                if (escuchandoNura && reconocimientoNura) {
                    try { reconocimientoNura.stop(); } catch (e) {}
                }
                const orb = document.getElementById("orbVozNura");
                if (orb) {
                    orb.classList.remove("escuchando");
                    orb.textContent = "🔊";
                }
            };

            voz.onend = () => {
                if (indice < partes.length) {
                    setTimeout(siguiente, 120);
                } else {
                    vozHablandoNura = false;
                    const orb = document.getElementById("orbVozNura");
                    if (orb) orb.textContent = "🎙️";
                    if (alTerminar) alTerminar();
                }
            };

            voz.onerror = () => {
                vozHablandoNura = false;
                if (alTerminar) alTerminar();
            };

            window.speechSynthesis.speak(voz);
        };

        siguiente();
    }

    // Memoria conversacional de la sesión: conserva los últimos turnos para dar continuidad.
    window.__nuraConversacion = window.__nuraConversacion || [];

    function guardarTurnoConversacionNura(usuario, asistente) {
        const historial = window.__nuraConversacion;
        historial.push({ usuario: String(usuario || "").trim(), asistente: String(asistente || "").trim(), momento: Date.now() });
        while (historial.length > 12) historial.shift();
    }

    function responderConversacionGeneralNura(t) {
        if (/\b(quien eres|qu[eé] eres|para qu[eé] sirves|qu[eé] puedes hacer|c[oó]mo me puedes ayudar)\b/.test(t)) {
            return "Soy NURA, tu asistente de bienestar. Puedo ayudarte a revisar tu menú, buscar sustituciones con los ingredientes que tienes, consultar tus bebidas, acompañarte con tus entrenamientos y revisar tu progreso. También puedo conversar contigo, aunque para preguntas muy abiertas todavía estoy aprendiendo y no tengo conectado un modelo externo de inteligencia artificial.";
        }
        if (/\b(c[oó]mo est[aá]s|qu[eé] tal est[aá]s)\b/.test(t)) {
            return "¡Aquí estoy, lista para ayudarte! ¿Qué hacemos hoy: revisamos tu comida, buscamos una alternativa con lo que tienes o vemos tu entrenamiento?";
        }
        if (/\b(gracias|muchas gracias|te agradezco)\b/.test(t)) {
            return "¡Con gusto! Para eso estoy. Seguimos paso a paso; dime qué necesitas y lo resolvemos juntas.";
        }
        if (/\b(repite|rep[ií]telo|no entend[ií]|qu[eé] dijiste)\b/.test(t)) {
            const ultimo = window.__nuraConversacion.length > 1 ? window.__nuraConversacion[window.__nuraConversacion.length - 2] : null;
            return ultimo && ultimo.asistente ? `Claro, te lo repito: ${ultimo.asistente}` : "Claro. Dime qué parte quieres que te explique de nuevo.";
        }
        if (/\b(qu[eé] recuerdas|qu[eé] hemos hablado|de qu[eé] habl[aá]bamos)\b/.test(t)) {
            const ultimo = window.__nuraConversacion.length > 1 ? window.__nuraConversacion[window.__nuraConversacion.length - 2] : null;
            return ultimo ? `Lo último que estábamos viendo era esto: tú me dijiste “${ultimo.usuario}” y yo te respondí “${ultimo.asistente}”.` : "Apenas estamos empezando esta conversación. Cuéntame qué necesitas y llevaré el hilo durante esta sesión.";
        }
        if (/\b(hola|buenas|buenos d[ií]as|buenas tardes|buenas noches)\b/.test(t)) {
            return "¡Hola! Aquí estoy. Podemos platicar con naturalidad; si estamos resolviendo algo, intentaré mantener el contexto para no hacerte repetir todo.";
        }
        return null;
    }

    function responderVozNura(texto) {
        const t = texto.toLowerCase();
        let respuesta = "Puedo ayudarte con tu alimentación, tus entrenamientos y tu progreso. Si me cuentas qué necesitas, lo vemos paso a paso.";
        let accion = null;
        const conversacionPendiente = Boolean(window.__nuraPendienteBebida || window.__nuraPendienteAlimento);

        // Las respuestas a una pregunta pendiente tienen prioridad sobre cualquier otro intent.
        if (conversacionPendiente || t.includes("no tengo") || t.includes("no cuento con") || t.includes("no hay") || t.includes("se me acab") || t.includes("ya no tengo") || t.includes("desayuno") || t.includes("desayunar") || t.includes("comida") || t.includes("comer") || t.includes("almuerzo") || t.includes("cena") || t.includes("cenar") || t.includes("alimentación") || t.includes("alimentacion") || t.includes("menú") || t.includes("menu") || t.includes("qué como") || t.includes("que como") || t.includes("bebida") || t.includes("tomar") || /\btengo(n)?\s+(huevos?|jam[oó]n|salchicha|queso|tortillas?|pan)\b/i.test(t)) {
            respuesta = obtenerResumenAlimentacionVoz(texto);
        } else if (t.includes("progreso") || t.includes("historial")) {
            respuesta = "Claro. Te voy a mostrar tu progreso. Después podemos seguir conversando.";
            accion = () => mostrarProgresoNura();
        } else if (t.includes("semana") || t.includes("plan")) {
            respuesta = "Claro. Voy a mostrarte tu semana y después seguimos con lo que necesites.";
            accion = () => generarPlan();
        } else if (t.includes("entrenamiento") || t.includes("entrenar") || t.includes("gimnasio")) {
            respuesta = "Perfecto. Puedes elegir una sesión desde tu semana y te acompaño durante el entrenamiento. ¿Quieres consultar la rutina o cambiar algo?";
        } else {
            respuesta = responderConversacionGeneralNura(t) || respuesta;
        }

        guardarTurnoConversacionNura(texto, respuesta);
        const estado = document.getElementById("estadoVozNura");
        if (estado) estado.textContent = respuesta;

        const terminar = () => {
            if (accion) {
                setTimeout(() => {
                    if (!vozActivaNura) return;
                    accion();
                    actualizarEstadoVozNura("Listo. Te sigo escuchando…");
                    programarEscuchaNura();
                }, 450);
                return;
            }
            if (vozActivaNura) {
                actualizarEstadoVozNura("Te escucho…");
                programarEscuchaNura();
            }
        };

        hablarTextoNaturalNura(respuesta, terminar);
    }

    function cerrarVozNura(event) {
        if (event && event.target !== event.currentTarget) return;
        vozActivaNura = false;
        vozHablandoNura = false;
        clearTimeout(reinicioVozNura);
        if (reconocimientoNura && escuchandoNura) {
            try { reconocimientoNura.stop(); } catch (e) {}
        }
        if ("speechSynthesis" in window) window.speechSynthesis.cancel();
        const panel = document.getElementById("panelVozNura");
        if (panel) panel.remove();
        reconocimientoNura = null;
        escuchandoNura = false;
    }


    /* =====================================================
       INICIAR
    ===================================================== */

    cargarPerfilNura();
    mostrarPortada();

</script>

        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
        }
    </script>
